# Nginx reverse proxy for Monster Dice Battle Socket.io server
# Install: sudo cp nginx-socket.conf /etc/nginx/sites-available/monster-socket
#          sudo ln -sf /etc/nginx/sites-available/monster-socket /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with your hostname (e.g. api.yourgame.com)

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # After certbot: listen 443 ssl; + ssl_certificate lines

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Socket.io WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# Required for WebSocket upgrade (add to /etc/nginx/nginx.conf inside http { } if missing):
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

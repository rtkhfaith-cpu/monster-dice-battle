version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - node scripts/write-socket-config.js
        - npm run build
        # SPA refresh: Amplify serves 404.html for unknown paths (same as index)
        - cp dist/index.html dist/404.html
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
